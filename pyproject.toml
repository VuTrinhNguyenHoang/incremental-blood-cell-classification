[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "incremental-blood-cell-classification"
version = "0.1.0"
description = "Class-incremental blood cell classification with replay memory."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[tool.hatch.build.targets.wheel]
packages = ["src/incremental_blood_cell"]

